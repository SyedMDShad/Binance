<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Posting Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles for the light glassy theme */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(120deg, #fdfbfb 0%, #ebedee 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background-color 0.3s ease;
        }
        
        /* True Black Dark mode styles */
        .dark body {
            background: #000000; /* Pure black background */
        }
        .dark .glass-card {
            background: rgba(28, 28, 30, 0.5); /* Dark, neutral gray with opacity */
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(58, 58, 60, 0.7); /* Darker gray border */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .dark .clock-widget {
            background: rgba(44, 44, 46, 0.5); /* Slightly lighter neutral gray */
            border: 1px solid rgba(58, 58, 60, 0.7);
        }
        .dark .date-picker {
            background-color: rgba(44, 44, 46, 0.5);
            border-color: rgba(58, 58, 60, 0.7);
            color: #d1d5db; /* gray-300 */
        }
        .dark .text-gray-800 { color: #f9fafb; /* gray-50 */ }
        .dark .text-gray-900 { color: #ffffff; }
        .dark .task-item { background-color: rgba(44, 44, 46, 0.3); }
        .dark .task-item:hover { background-color: rgba(58, 58, 60, 0.6); }
        .dark .task-checkbox { background-color: rgba(58, 58, 60, 0.5); }
        .dark .bg-black\/10 { background-color: rgba(255,255,255,0.1); }
        .dark .pm-time-color { color: #c4b5fd; } /* Lighter purple for dark mode */


        .glass-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            width: 100%;
        }
        
        .clock-widget {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 0.75rem 1.5rem;
            box-shadow: 0 4px 15px 0 rgba(0, 0, 0, 0.08);
        }

        .date-picker {
            background-color: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: #374151;
            cursor: pointer;
            width: 100%;
        }

        .task-checkbox {
            appearance: none; -webkit-appearance: none;
            height: 1.25rem; width: 1.25rem;
            background-color: rgba(0, 0, 0, 0.1);
            border-radius: 0.375rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            outline: none; transition: background-color 0.2s ease;
        }
        .task-checkbox:checked { background-color: #34d399; }
        .task-checkbox:checked::before { content: '✔'; color: white; font-size: 0.875rem; }
        
        .task-item.completed { opacity: 0.5; }
        .task-item.completed .task-text { text-decoration: line-through; }
        
        .task-item { transition: transform 0.2s ease-out, box-shadow 0.2s ease-out, background-color 0.2s ease-out; }
        .task-item:hover {
            transform: translateX(5px) scale(1.03);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .bd-time-color { color: #10b981; }
        .usa-time-color { color: #f87171; }
        
        .pm-time-color {
            color: #8b5cf6; /* A nice purple color (violet-500) */
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="container mx-auto px-2 sm:px-4 w-full max-w-6xl">
        
        <!-- Header with Theme Toggle -->
        <div class="flex justify-center items-center my-8 gap-4 flex-wrap">
             <div class="clock-widget">
                <h3 class="font-semibold text-sm bd-time-color">Bangladesh Time</h3>
                <p id="bd-clock" class="text-xl md:text-2xl font-bold text-gray-900 tabular-nums"></p>
            </div>
            <div class="clock-widget">
                <h3 class="font-semibold text-sm usa-time-color">USA Time (NY)</h3>
                <p id="usa-clock" class="text-xl md:text-2xl font-bold text-gray-900 tabular-nums"></p>
            </div>
            <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-800">
                <!-- Sun Icon -->
                <svg id="theme-toggle-light-icon" class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <!-- Moon Icon -->
                <svg id="theme-toggle-dark-icon" class="w-6 h-6 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>

        <!-- Schedule Cards -->
        <main class="flex flex-col lg:flex-row items-start justify-center gap-6">
            <div class="glass-card p-5 md:p-6 flex-1">
                <div class="text-center mb-4"><h2 class="text-xl font-bold">ARTS</h2><input type="date" id="arts-date" class="date-picker mt-2 text-sm"></div>
                <div id="arts-tasks" class="space-y-3"></div>
            </div>
            <div class="glass-card p-5 md:p-6 flex-1">
                <div class="text-center mb-4"><h2 class="text-xl font-bold">BOOM</h2><input type="date" id="boom-date" class="date-picker mt-2 text-sm"></div>
                <div id="boom-tasks" class="space-y-3"></div>
            </div>
            <div class="glass-card p-5 md:p-6 flex-1">
                <div class="text-center mb-4"><h2 class="text-xl font-bold">SHOP</h2><input type="date" id="shop-date" class="date-picker mt-2 text-sm"></div>
                <div id="shop-tasks" class="space-y-3"></div>
            </div>
        </main>
    </div>

    <script>
        // Data for the schedules, re-ordered as requested
        let scheduleData = {
            arts: [
                { slot: 1, bd: '1:00 AM', usa: '3:00 PM' }, { slot: 2, bd: '4:00 AM', usa: '6:00 PM' },
                { slot: 3, bd: '7:00 AM', usa: '9:00 PM' }, { slot: 4, bd: '10:00 AM', usa: '12:00 AM' },
                { slot: 5, bd: '7:00 PM', usa: '9:00 AM' }, { slot: 6, bd: '10:00 PM', usa: '12:00 PM' }
            ],
            boom: [
                { slot: 1, bd: '2:00 AM', usa: '4:00 PM' }, { slot: 2, bd: '5:00 AM', usa: '7:00 PM' },
                { slot: 3, bd: '8:00 AM', usa: '10:00 PM' }, { slot: 4, bd: '11:00 AM', usa: '1:00 AM' },
                { slot: 5, bd: '8:00 PM', usa: '10:00 AM' }, { slot: 6, bd: '11:00 PM', usa: '1:00 PM' }
            ],
            shop: [
                { slot: 1, bd: '12:00 AM', usa: '2:00 PM' }, { slot: 2, bd: '3:00 AM', usa: '5:00 PM' },
                { slot: 3, bd: '6:00 AM', usa: '8:00 PM' }, { slot: 4, bd: '9:00 AM', usa: '11:00 PM' },
                { slot: 5, bd: '12:00 PM', usa: '2:00 AM' }, { slot: 6, bd: '9:00 PM', usa: '11:00 AM' }
            ]
        };
        
        // --- THEME TOGGLE LOGIC ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const lightIcon = document.getElementById('theme-toggle-light-icon');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const htmlEl = document.documentElement;

        if (localStorage.getItem('theme') === 'dark') {
            htmlEl.classList.add('dark');
            lightIcon.classList.add('hidden');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', () => {
            htmlEl.classList.toggle('dark');
            lightIcon.classList.toggle('hidden');
            darkIcon.classList.toggle('hidden');
            if (htmlEl.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });

        // --- CLOCK FUNCTIONALITY ---
        function updateClocks() {
            const now = new Date();
            const bdTime = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Dhaka', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('bd-clock').textContent = bdTime;
            const usaTime = now.toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('usa-clock').textContent = usaTime;
        }

        // --- CORE APP LOGIC ---
        function getTodayDateStringBD() {
            const today = new Date();
            const options = { timeZone: 'Asia/Dhaka', year: 'numeric', month: '2-digit', day: '2-digit' };
            const formatter = new Intl.DateTimeFormat('en-CA', options); // 'en-CA' locale gives YYYY-MM-DD format
            return formatter.format(today);
        }

        function createTaskItem(item, cardId, index) {
            const bdTimeClass = (item.slot >= 5) ? "font-bold pm-time-color" : "font-bold bd-time-color";
            return `
                <div class="task-item flex items-center justify-between p-3 rounded-lg">
                    <div class="flex items-center gap-3">
                        <div class="flex-shrink-0 w-7 h-7 bg-black/10 rounded-md flex items-center justify-center font-bold text-xs">
                            ${item.slot}
                        </div>
                        <div class="task-text text-sm">
                            <p class="${bdTimeClass}">${item.bd} <span class="text-gray-500 text-xs">(BD)</span></p>
                            <p class="font-normal usa-time-color">${item.usa} <span class="text-gray-500 text-xs">(USA)</span></p>
                        </div>
                    </div>
                    <input type="checkbox" class="task-checkbox flex-shrink-0" data-card="${cardId}" data-index="${index}">
                </div>
            `;
        }

        function renderSchedule(cardId) {
            const container = document.getElementById(`${cardId}-tasks`);
            container.innerHTML = ''; 
            scheduleData[cardId].forEach((item, index) => {
                container.innerHTML += createTaskItem(item, cardId, index);
                if (index === 3) {
                    container.innerHTML += `<div class="my-1 border-t border-dashed border-black/20 dark:border-white/20"></div>`;
                }
            });
        }
        
        function saveState(cardId) {
            const date = document.getElementById(`${cardId}-date`).value;
            const checkboxes = document.querySelectorAll(`#${cardId}-tasks .task-checkbox`);
            const state = Array.from(checkboxes).map(cb => cb.checked);
            localStorage.setItem(`schedule-${cardId}-${date}`, JSON.stringify(state));
        }

        function loadState(cardId) {
            const date = document.getElementById(`${cardId}-date`).value;
            const state = JSON.parse(localStorage.getItem(`schedule-${cardId}-${date}`));
            const checkboxes = document.querySelectorAll(`#${cardId}-tasks .task-checkbox`);
            
            checkboxes.forEach((checkbox, index) => {
                checkbox.checked = state ? state[index] : false;
                const taskItem = checkbox.closest('.task-item');
                taskItem.classList.toggle('completed', checkbox.checked);
            });
        }

        // Initial setup when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            updateClocks();
            setInterval(updateClocks, 1000);

            const cardIds = ['arts', 'boom', 'shop'];
            
            cardIds.forEach(cardId => {
                renderSchedule(cardId);
                const datePicker = document.getElementById(`${cardId}-date`);
                datePicker.value = getTodayDateStringBD(); // Use BD date
                loadState(cardId);
                
                datePicker.addEventListener('change', () => loadState(cardId));
            });
            
            document.querySelector('.container').addEventListener('change', (e) => {
                if (e.target.classList.contains('task-checkbox')) {
                    const cardId = e.target.dataset.card;
                    const taskItem = e.target.closest('.task-item');
                    taskItem.classList.toggle('completed', e.target.checked);
                    saveState(cardId);
                }
            });
        });
    </script>
</body>
</html>
