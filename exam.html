<html lang="bn" class="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            color: #e2e8f0; /* slate-200 */
        }
        .glass-card {
            background: rgba(26, 32, 44, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .glass-button {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease-in-out;
        }
        .glass-button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        .glass-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .progress-bar-inner {
            transition: width 0.5s ease-in-out;
        }
        .page-answer-input {
             background-color: rgba(45, 55, 72, 0.7);
             color: #e2e8f0; /* slate-200 */
        }
        .page-answer-input::placeholder {
            color: #94a3b8; /* slate-400 */
        }
        .page-answer-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #3b82f6; /* Ring color */
        }
    </style>
</head>

    <div class="min-h-screen w-full p-2 sm:p-4 flex flex-col items-center justify-center">

            <!-- Main Menu -->
            <div id="mainMenu">
                <h1 class="text-3xl md:text-4xl font-bold text-center mb-2 text-white">English Learning Hub</h1>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <button onclick="selectCategory('enToBn')" class="glass-button p-6 rounded-2xl text-xl font-semibold">English to Bangla Words</button>
                    <button onclick="selectCategory('bnToEnSentence')" class="glass-button p-6 rounded-2xl text-xl font-semibold">Bangla to English Sentences</button>
                    <button onclick="selectCategory('enToBnSentence')" class="glass-button p-6 rounded-2xl text-xl font-semibold">English to Bangla Sentences</button>
                </div>
            </div>

            <!-- Chapter Menu -->
            <div id="chapterMenu" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 id="chapterTitle" class="text-2xl md:text-3xl font-bold"></h2>
                    <button onclick="backToMainMenu()" class="glass-button py-2 px-4 text-sm rounded-lg">মূল মেনু</button>
                </div>
                <!-- Progress Stats -->
                <div id="progressStatsContainer" class="mb-6"></div>

                <div id="chapterList" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Chapters will be dynamically inserted here -->
                </div>
            </div>

            <!-- Quiz View -->
            <div id="quizContainer" class="hidden">
                 <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 id="quizTitle" class="text-2xl font-bold"></h2>
                        <p class="text-gray-300">মোট প্রশ্ন: <span id="totalQuestions">0</span></p>
                    </div>
                    <button onclick="backToChapterMenu()" class="glass-button py-2 px-4 text-sm rounded-lg">চ্যাপ্টার মেনু</button>
                </div>
                <div class="w-full bg-gray-700/50 rounded-full h-2.5 mb-6">
                    <div id="progressBar" class="bg-blue-500 h-2.5 rounded-full progress-bar-inner" style="width: 0%"></div>
                </div>

                <div id="questionList" class="space-y-4">
                    <!-- Questions will be dynamically inserted here -->
                </div>
            </div>

            <!-- Results View -->
            <div id="resultsContainer" class="hidden text-center">
                <h2 class="text-3xl font-bold mb-4">চমৎকার! চ্যাপ্টার শেষ করেছেন।</h2>
                <p class="text-xl mb-6">আপনার এই চ্যাপ্টারের স্কোর:</p>
                <div class="relative w-48 h-48 mx-auto flex items-center justify-center mb-8">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <circle class="text-gray-700/50" stroke-width="10" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
                        <circle id="resultCircle" class="text-green-500" stroke-width="10" stroke-linecap="round" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" style="transition: stroke-dashoffset 1.5s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%;" />
                    </svg>

                </div>
                <p id="finalMessage" class="text-lg mb-8"></p>
                <div class="flex justify-center gap-4">
                    <button onclick="restartChapter()" class="glass-button py-3 px-6 rounded-xl text-lg font-semibold">আবার চেষ্টা করুন</button>
                    <button onclick="backToChapterMenu()" class="glass-button py-3 px-6 rounded-xl text-lg font-semibold">অন্য চ্যাপ্টার</button>
                </div>
            </div>
        </main>
    </div>

                        <div>
                            <p class="font-semibold text-yellow-400">${completedQuestions}</p>
                            <p class="text-gray-300">উত্তর দিয়েছেন</p>
                        </div>
                        <div>
                            <p class="font-semibold text-green-400">${correctAnswers}</p>
                            <p class="text-gray-300">সঠিক উত্তর</p>
                        </div>
                         <div>
                            <p class="font-semibold text-red-400">${incorrectAnswers}</p>
                            <p class="text-gray-300">ভুল উত্তর</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function startQuiz(category, chapterIndex) {
            currentCategory = category;
            currentChapterIndex = chapterIndex;
            
            const savedQuiz = loadAttemptProgress(); 
            
            if (savedQuiz) {
                currentQuiz = savedQuiz;
            } else {
                currentQuiz = [...chapteredWordGroups[category][chapterIndex]];
                shuffleArray(currentQuiz);
            }
            
            quizTitle.textContent = `${categoryTitles[category]} - Chapter ${chapterIndex + 1}`;
            totalQuestionsEl.textContent = currentQuiz.length;

            chapterMenu.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            quizContainer.classList.remove('hidden');
            
            updateProgressBar();
            displayCurrentPage();
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function displayCurrentPage() {
            questionList.innerHTML = '';
            currentQuiz.forEach((question, index) => {
                const item = document.createElement('div');
                item.className = 'question-row';
                
                // Using a more responsive layout. Stacks on mobile, goes to grid on medium screens.
                item.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-12 gap-y-2 md:gap-x-4 items-center p-3 rounded-lg hover:bg-white/5 transition-colors duration-200">
                        <p class="md:col-span-5 text-lg font-medium">
                            <span class="mr-2 text-gray-400">${index + 1}.</span>${question.q}
                        </p>
                        <div class="md:col-span-4">
                            <input type="text" id="answer-${index}" data-index="${index}" 
                                   placeholder="উত্তর লিখুন..." 
                                   class="page-answer-input w-full text-base p-2 rounded-md border border-gray-600 focus:border-blue-500 focus:ring-blue-500 transition">
                        </div>
                        <div id="result-${index}" class="md:col-span-3 result-display text-base font-medium min-h-[2.5rem] flex items-center md:pl-2"></div>
                    </div>
                `;
                questionList.appendChild(item);
                
                const input = item.querySelector(`#answer-${index}`);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && input.value.trim() !== '') {
                        checkSingleAnswer(index, input);
                    }
                });

                if (userAnswers[question.q]) {
                    input.value = userAnswers[question.q].userAnswer;
                    input.disabled = true;
                    const resultDiv = document.getElementById(`result-${index}`);
                    if(userAnswers[question.q].isCorrect) {
                         resultDiv.innerHTML = `<span class="text-2xl mr-2 text-green-500">✅</span> <span class="text-green-400">সঠিক!</span>`;
                    } else {
                         resultDiv.innerHTML = `<span class="text-2xl mr-2 text-red-500">❌</span> <span class="text-red-400">সঠিক উত্তর: ${currentQuiz[index].a}</span>`;
                    }
                }
            });
        }
        
        function checkSingleAnswer(questionIndex, inputElement) {
            const resultDiv = document.getElementById(`result-${questionIndex}`);
            const userAnswer = inputElement.value.trim();
            const questionObj = currentQuiz[questionIndex];
            const correctAnswer = questionObj.a;
            const questionKey = questionObj.q; // Use the question itself as a unique key
            
            answerTries[questionKey] = (answerTries[questionKey] || 0) + 1;

            if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
                userAnswers[questionKey] = { userAnswer, isCorrect: true };
                inputElement.disabled = true;
                resultDiv.innerHTML = `<span class="text-2xl mr-2 text-green-500">✅</span> <span class="text-green-400">সঠিক!</span>`;
            } else {
                if (answerTries[questionKey] >= 3) {
                    userAnswers[questionKey] = { userAnswer, isCorrect: false };
                    inputElement.disabled = true;
                    resultDiv.innerHTML = `<span class="text-2xl mr-2 text-red-500">❌</span> <span class="text-red-400">সঠিক উত্তর: ${correctAnswer}</span>`;
                } else {
                    const triesLeft = 3 - answerTries[questionKey];
                    resultDiv.innerHTML = `<span class="text-2xl mr-2 text-yellow-500">🤔</span> <span class="text-yellow-400">ভুল হয়েছে। আবার চেষ্টা করুন (${triesLeft} টি সুযোগ বাকি)</span>`;
                    inputElement.select();
                }
            }

            if (inputElement.disabled) {
                saveAttemptProgress();
                updateProgressBar(true);
            }
        }
        
        function updateProgressBar(checkFinish = false) {
             const answeredCount = Object.keys(userAnswers).length;
             const progress = (answeredCount / currentQuiz.length) * 100;
             progressBar.style.width = `${progress}%`;

             if (checkFinish && answeredCount === currentQuiz.length) {
                 setTimeout(showResults, 1500);
             }
        }

        function calculateCurrentScore() {
            score = 0;
            currentQuiz.forEach(question => {
                const questionKey = question.q;
                 if(userAnswers[questionKey] && userAnswers[questionKey].isCorrect) {
                    score++;
                }
            });
        }

        function showResults() {
            calculateCurrentScore();
            saveChapterResult();

            const percentage = Math.round((score / currentQuiz.length) * 100);
            
            quizContainer.classList.add('hidden');
            resultsContainer.classList.remove('hidden');

            scorePercentage.textContent = `${percentage}%`;

            if (percentage >= 80) finalMessage.textContent = "অসাধারণ!";
            else if (percentage >= 60) finalMessage.textContent = "খুব ভালো!";
            else if (percentage >= 40) finalMessage.textContent = "ভালো চেষ্টা!";
            else finalMessage.textContent = "অনুশীলন চালিয়ে যান।";

            const circle = resultCircle;
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            const offset = circumference - percentage / 100 * circumference;
            circle.style.strokeDashoffset = offset;
        }
        
        function restartChapter() {
            const category = currentCategory;
            const chapterIndex = currentChapterIndex;
            localStorage.removeItem(getAttemptProgressKey());
            // No need to reset globals, loadAttemptProgress will handle it
            startQuiz(category, chapterIndex);
        }

        function backToChapterMenu() {
            quizContainer.classList.add('hidden');
            resultsContainer.classList.add('hidden');
            selectCategory(currentCategory);
        }
        
        function backToMainMenu() {
            chapterMenu.classList.add('hidden');
            mainMenu.classList.remove('hidden');
        }
        
        // --- PROGRESS MANAGEMENT ---

        function getAttemptProgressKey() {
            return `attempt-${currentCategory}-${currentChapterIndex}`;
        }

        function saveAttemptProgress() {
            const progress = { answers: userAnswers, tries: answerTries, quiz: currentQuiz };
            localStorage.setItem(getAttemptProgressKey(), JSON.stringify(progress));
        }

        function loadAttemptProgress() {
            const savedProgress = localStorage.getItem(getAttemptProgressKey());
            if (savedProgress) {
                const progress = JSON.parse(savedProgress);
                userAnswers = progress.answers || {};
                answerTries = progress.tries || {};
                return progress.quiz; // Return saved quiz order
            } 
            // If no progress, reset state for new attempt
            userAnswers = {};
            answerTries = {};
            return null;
        }
        
        function loadOverallProgress() {
            const savedProgress = localStorage.getItem('englishHubProgress');
            overallProgress = savedProgress ? JSON.parse(savedProgress) : {};
        }

        function saveOverallProgress() {
            localStorage.setItem('englishHubProgress', JSON.stringify(overallProgress));
        }

        function saveChapterResult() {
            if (!overallProgress[currentCategory]) {
                overallProgress[currentCategory] = { completedChapters: {} };
            }
            
            // To prevent issues with shuffled order, create a map of answers using question as key
            const finalAnswers = {};
            currentQuiz.forEach(q => {
                if (userAnswers[q.q]) {
                    finalAnswers[q.q] = userAnswers[q.q];
                }
            });

            overallProgress[currentCategory].completedChapters[currentChapterIndex] = {
                answers: finalAnswers,
                score: score,
            };
            saveOverallProgress();
        }


        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            setupChapters();
            loadOverallProgress();
        });

    </script>
</body>
</html>
