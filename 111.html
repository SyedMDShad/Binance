<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Arena - Battle Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        // --- YOUR KEY ---
        const USER_KEY = "AIzaSyDOvdH7pR_P4zBhJzVW6edDv-JOovfhnJQ";

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: '#121212',
                        card: '#1e1e1e',
                        border: '#2c2c2c',
                        accent: '#cba6f7', // Arena-like purple hint
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .scroll-hide::-webkit-scrollbar { width: 6px; }
        .scroll-hide::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .msg-user { background-color: #2b2b2b; border-radius: 12px 12px 0 12px; }
        .msg-ai { background-color: transparent; }
        .typing-indicator span {
            display: inline-block; width: 4px; height: 4px; background: #888; border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both; margin: 0 1px;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        /* Select Dropdown styling like Arena */
        .arena-select {
            background: #2c2c2c; border: 1px solid #3a3a3a; color: white; padding: 4px 8px; 
            border-radius: 6px; font-size: 12px; outline: none; cursor: pointer;
        }
        .arena-select:hover { border-color: #555; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <header class="h-14 border-b border-border bg-[#181818] flex items-center justify-between px-4 z-50">
        <div class="flex items-center gap-4">
            <div class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent cursor-pointer" onclick="location.reload()">
                Gemini Arena ⚔️
            </div>
            <!-- Mode Switcher -->
            <div class="hidden md:flex bg-dark rounded-lg p-1 border border-border">
                <button onclick="switchMode('arena')" id="btn-arena" class="px-3 py-1 rounded text-xs font-medium bg-gray-700 text-white transition">Side-by-Side</button>
                <button onclick="switchMode('studio')" id="btn-studio" class="px-3 py-1 rounded text-xs font-medium text-gray-400 hover:text-white transition">Image Studio</button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <div id="status" class="text-[10px] text-green-500 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span> Online
            </div>
            <button onclick="openSettings()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-gear"></i></button>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="flex-1 relative overflow-hidden flex">

        <!-- VIEW 1: ARENA (CHAT) -->
        <div id="view-arena" class="flex-1 flex flex-col w-full h-full">
            
            <!-- Model Headers -->
            <div class="h-10 border-b border-border flex bg-[#181818]">
                <!-- Left Header -->
                <div class="flex-1 border-r border-border flex items-center justify-between px-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-blue-400">Model A</span>
                        <select id="leftModel" class="arena-select">
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                            <option value="gemini-3-pro-preview">Gemini 3.0 Pro (Preview)</option>
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        </select>
                    </div>
                    <button onclick="clearSide('left')" class="text-gray-500 hover:text-white text-xs"><i class="fa-solid fa-eraser"></i></button>
                </div>
                
                <!-- Right Header -->
                <div class="flex-1 flex items-center justify-between px-3">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-purple-400">Model B</span>
                        <select id="rightModel" class="arena-select">
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                            <option value="gemini-2.5-flash-image">Gemini 2.5 Flash (Img Gen)</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                            <option value="gemini-3-flash-preview">Gemini 3.0 Flash</option>
                        </select>
                    </div>
                    <button onclick="clearSide('right')" class="text-gray-500 hover:text-white text-xs"><i class="fa-solid fa-eraser"></i></button>
                </div>
            </div>

            <!-- Chat Windows -->
            <div class="flex-1 flex overflow-hidden">
                <!-- Left Window -->
                <div id="leftChat" class="flex-1 bg-[#0d0d0d] overflow-y-auto p-4 space-y-4 border-r border-border scroll-hide">
                    <div class="text-center mt-20 text-gray-700 text-xs uppercase tracking-widest font-bold">Model A Ready</div>
                </div>
                
                <!-- Right Window -->
                <div id="rightChat" class="flex-1 bg-[#0d0d0d] overflow-y-auto p-4 space-y-4 scroll-hide">
                    <div class="text-center mt-20 text-gray-700 text-xs uppercase tracking-widest font-bold">Model B Ready</div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="p-4 bg-[#181818] border-t border-border">
                <div class="max-w-4xl mx-auto flex flex-col gap-2">
                    <!-- Image Preview -->
                    <div id="imgPreview" class="hidden flex items-center gap-2 bg-[#252525] p-2 rounded w-fit">
                        <img id="thumb" src="" class="h-10 w-10 object-cover rounded border border-gray-600">
                        <span class="text-xs text-gray-400">Image attached</span>
                        <button onclick="clearImg()" class="text-red-400 hover:text-white ml-2"><i class="fa-solid fa-times"></i></button>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="document.getElementById('fileIn').click()" class="h-10 w-10 rounded-lg bg-[#252525] hover:bg-[#333] text-gray-400 transition flex items-center justify-center border border-border">
                            <i class="fa-solid fa-image"></i>
                        </button>
                        <input type="file" id="fileIn" class="hidden" accept="image/*" onchange="handleFile(event)">
                        
                        <textarea id="prompt" rows="1" class="flex-1 bg-[#252525] text-white text-sm px-3 py-2.5 rounded-lg border border-border focus:border-blue-500 outline-none resize-none" placeholder="Enter your prompt here..."></textarea>
                        
                        <button onclick="send()" class="h-10 w-10 rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition flex items-center justify-center">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="text-center text-[10px] text-gray-600">
                        Models will generate responses simultaneously.
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: IMAGE STUDIO -->
        <div id="view-studio" class="flex-1 flex flex-col hidden bg-[#050505]">
            <div class="h-10 border-b border-border bg-[#181818] flex items-center justify-between px-4">
                <span class="text-xs font-bold text-gray-400 uppercase">Local Image Editor</span>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('editFile').click()" class="text-xs bg-blue-600 px-3 py-1 rounded text-white hover:bg-blue-500">Upload</button>
                    <input type="file" id="editFile" class="hidden" onchange="loadEditorImage(event)">
                    <button onclick="downloadEdit()" class="text-xs bg-green-600 px-3 py-1 rounded text-white hover:bg-green-500">Save</button>
                </div>
            </div>

            <div class="flex-1 flex overflow-hidden">
                <!-- Canvas -->
                <div class="flex-1 flex items-center justify-center p-8 bg-[url('https://www.transparenttextures.com/patterns/dark-matter.png')]">
                    <canvas id="canvas" class="max-w-full max-h-full shadow-2xl border border-gray-800 hidden"></canvas>
                    <div id="studio-placeholder" class="text-center text-gray-600">
                        <i class="fa-solid fa-image text-4xl mb-2"></i>
                        <p class="text-xs">Upload an image to edit</p>
                    </div>
                </div>

                <!-- Tools Panel -->
                <div class="w-64 bg-[#111] border-l border-border p-4 space-y-6 overflow-y-auto">
                    <div>
                        <label class="text-[10px] uppercase text-gray-500 font-bold mb-2 block">Quick Actions</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="applyFilter('invert')" class="bg-[#222] hover:bg-[#333] text-gray-300 py-2 rounded text-xs border border-border">Invert</button>
                            <button onclick="applyFilter('bw')" class="bg-[#222] hover:bg-[#333] text-gray-300 py-2 rounded text-xs border border-border">B&W</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase text-gray-500 font-bold mb-2 block">Adjustments</label>
                        <div class="space-y-3">
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Brightness</span><span id="v-b">100%</span></div>
                                <input type="range" min="0" max="200" value="100" class="w-full h-1 bg-gray-700 rounded cursor-pointer mt-1" oninput="updateEdit('brightness', this.value)">
                            </div>
                            <div>
                                <div class="flex justify-between text-[10px] text-gray-400"><span>Contrast</span><span id="v-c">100%</span></div>
                                <input type="range" min="0" max="200" value="100" class="w-full h-1 bg-gray-700 rounded cursor-pointer mt-1" oninput="updateEdit('contrast', this.value)">
                            </div>
                            <button onclick="commitEdit()" class="w-full bg-blue-900/30 text-blue-400 border border-blue-900/50 py-1.5 rounded text-xs mt-2 hover:bg-blue-900/50">Apply Changes</button>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] uppercase text-gray-500 font-bold mb-2 block">Upscale</label>
                        <div class="flex gap-2">
                            <button onclick="doUpscale(2)" class="flex-1 bg-[#222] hover:bg-purple-900/20 text-gray-300 hover:text-purple-400 py-2 rounded text-xs border border-border">2x HD</button>
                            <button onclick="doUpscale(4)" class="flex-1 bg-[#222] hover:bg-purple-900/20 text-gray-300 hover:text-purple-400 py-2 rounded text-xs border border-border">4x Ultra</button>
                        </div>
                    </div>
                    
                    <button onclick="resetCanvas()" class="w-full text-red-400 hover:text-red-300 text-xs py-2 border border-red-900/30 rounded hover:bg-red-900/10">Reset All</button>
                </div>
            </div>
        </div>

    </div>

    <!-- API Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] hidden flex items-center justify-center">
        <div class="bg-[#1e1e1e] w-80 p-5 rounded-lg border border-border shadow-2xl">
            <h3 class="text-sm font-bold text-white mb-4">Settings</h3>
            <label class="text-xs text-gray-400 block mb-1">Google API Key</label>
            <input type="password" id="apiKeyInput" class="w-full bg-[#121212] border border-border rounded p-2 text-xs text-white mb-4 outline-none focus:border-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="openSettings()" class="text-xs text-gray-400 hover:text-white px-3 py-1">Cancel</button>
                <button onclick="saveKey()" class="text-xs bg-blue-600 text-white px-3 py-1.5 rounded">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- CORE ---
        const state = {
            key: localStorage.getItem('gemini_key') || USER_KEY,
            chatImg: null,
            editor: { img: null, history: [], filters: {b:100, c:100}, name: 'image.png' }
        };

        // --- NAVIGATION ---
        function switchMode(mode) {
            document.getElementById('view-arena').classList.add('hidden');
            document.getElementById('view-studio').classList.add('hidden');
            document.getElementById(`view-${mode}`).classList.remove('hidden');
            
            // Update buttons
            document.getElementById('btn-arena').className = mode === 'arena' ? "px-3 py-1 rounded text-xs font-medium bg-gray-700 text-white transition" : "px-3 py-1 rounded text-xs font-medium text-gray-400 hover:text-white transition";
            document.getElementById('btn-studio').className = mode === 'studio' ? "px-3 py-1 rounded text-xs font-medium bg-gray-700 text-white transition" : "px-3 py-1 rounded text-xs font-medium text-gray-400 hover:text-white transition";
        }

        // --- SETTINGS ---
        function openSettings() {
            const m = document.getElementById('settingsModal');
            m.classList.toggle('hidden');
            if(!m.classList.contains('hidden')) document.getElementById('apiKeyInput').value = state.key;
        }
        function saveKey() {
            const k = document.getElementById('apiKeyInput').value;
            state.key = k;
            localStorage.setItem('gemini_key', k);
            openSettings();
        }

        // --- ARENA CHAT ---
        function handleFile(e) {
            const f = e.target.files[0];
            if(!f) return;
            const r = new FileReader();
            r.onload = ev => {
                state.chatImg = ev.target.result;
                document.getElementById('thumb').src = ev.target.result;
                document.getElementById('imgPreview').classList.remove('hidden');
            };
            r.readAsDataURL(f);
        }
        function clearImg() {
            state.chatImg = null;
            document.getElementById('imgPreview').classList.add('hidden');
            document.getElementById('fileIn').value = '';
        }
        function clearSide(side) {
            document.getElementById(`${side}Chat`).innerHTML = `<div class="text-center mt-20 text-gray-700 text-xs uppercase tracking-widest font-bold">Model ${side === 'left' ? 'A' : 'B'} Ready</div>`;
        }

        async function send() {
            const txt = document.getElementById('prompt').value;
            if(!txt && !state.chatImg) return;
            
            document.getElementById('prompt').value = '';
            
            // Prepare image data if exists
            let imgData = null, mime = null;
            if(state.chatImg) {
                const parts = state.chatImg.split(',');
                mime = parts[0].match(/:(.*?);/)[1];
                imgData = parts[1];
                clearImg(); // Remove from input after send
            }

            // User Bubbles
            addBubble('left', 'user', txt, state.chatImg);
            addBubble('right', 'user', txt, state.chatImg);

            // Get selected models
            const modelA = document.getElementById('leftModel').value;
            const modelB = document.getElementById('rightModel').value;

            // Fetch
            callAPI(modelA, 'left', txt, imgData, mime);
            callAPI(modelB, 'right', txt, imgData, mime);
        }

        function addBubble(side, role, text, img) {
            const container = document.getElementById(`${side}Chat`);
            if(container.querySelector('.text-center')) container.innerHTML = ''; // Remove placeholder

            const div = document.createElement('div');
            div.className = `p-3 text-sm mb-4 ${role === 'user' ? 'msg-user text-white ml-auto max-w-[85%]' : 'msg-ai text-gray-300 mr-auto w-full border-b border-border pb-2'}`;
            
            if(img && role === 'user') {
                div.innerHTML += `<img src="${img}" class="max-h-32 rounded border border-gray-600 mb-2">`;
            }
            
            if(role === 'load') {
                div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
                div.id = `load-${side}`;
            } else {
                div.innerHTML += text ? text.replace(/\n/g, '<br>') : '';
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function callAPI(model, side, prompt, imgB64, mime) {
            addBubble(side, 'load');
            try {
                const parts = [];
                if(prompt) parts.push({text: prompt});
                if(imgB64) parts.push({inline_data: {mime_type: mime, data: imgB64}});

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${state.key}`;
                
                // Safety: OFF
                const safety = [
                    { category: "HARM_CATEGORY_HARASSMENT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_HATE_SPEECH", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_SEXUALLY_EXPLICIT", threshold: "BLOCK_NONE" },
                    { category: "HARM_CATEGORY_DANGEROUS_CONTENT", threshold: "BLOCK_NONE" }
                ];

                const res = await fetch(url, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{parts}], safetySettings: safety })
                });

                const data = await res.json();
                document.getElementById(`load-${side}`).remove();

                if(data.error) throw new Error(data.error.message);

                let reply = "";
                // Handle text and images in response
                if(data.candidates?.[0]?.content?.parts) {
                    data.candidates[0].content.parts.forEach(p => {
                        if(p.text) reply += p.text;
                        if(p.inline_data) reply += `<br><img src="data:${p.inline_data.mime_type};base64,${p.inline_data.data}" class="mt-2 rounded border border-gray-700 max-w-full">`;
                    });
                } else {
                    reply = "⚠️ No content returned.";
                }
                
                // Simple markdown parse
                reply = reply.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                
                addBubble(side, 'ai', reply);

            } catch(e) {
                document.getElementById(`load-${side}`)?.remove();
                addBubble(side, 'ai', `<span class="text-red-400 text-xs">Error: ${e.message}</span>`);
            }
        }

        // --- IMAGE STUDIO (CANVAS) ---
        const cvs = document.getElementById('canvas');
        const ctx = cvs.getContext('2d');

        function loadEditorImage(e) {
            const f = e.target.files[0];
            if(!f) return;
            state.editor.name = f.name;
            const r = new FileReader();
            r.onload = ev => {
                const img = new Image();
                img.onload = () => {
                    state.editor.img = img;
                    state.editor.history = [img.src];
                    draw();
                    document.getElementById('studio-placeholder').classList.add('hidden');
                    cvs.classList.remove('hidden');
                };
                img.src = ev.target.result;
            };
            r.readAsDataURL(f);
        }

        function draw(src = null, filterStr = null) {
            const img = new Image();
            img.onload = () => {
                cvs.width = img.width;
                cvs.height = img.height;
                if(filterStr) ctx.filter = filterStr;
                else ctx.filter = `brightness(${state.editor.filters.b}%) contrast(${state.editor.filters.c}%)`;
                ctx.drawImage(img, 0, 0);
            };
            img.src = src || (state.editor.history.length ? state.editor.history[state.editor.history.length-1] : state.editor.img.src);
        }

        function updateEdit(t, v) {
            if(t==='brightness') { state.editor.filters.b = v; document.getElementById('v-b').innerText = v+'%'; }
            if(t==='contrast') { state.editor.filters.c = v; document.getElementById('v-c').innerText = v+'%'; }
            draw();
        }

        function commitEdit() {
            state.editor.history.push(cvs.toDataURL());
            // Reset sliders visual only, keep logic consistent
            state.editor.filters = {b:100, c:100};
            document.querySelectorAll('input[type=range]').forEach(i=>i.value=100);
            document.getElementById('v-b').innerText = '100%';
            document.getElementById('v-c').innerText = '100%';
        }

        function applyFilter(type) {
            if(!state.editor.img) return;
            const w = cvs.width, h = cvs.height;
            const d = ctx.getImageData(0,0,w,h);
            const da = d.data;
            for(let i=0; i<da.length; i+=4) {
                if(type === 'invert') { da[i]=255-da[i]; da[i+1]=255-da[i+1]; da[i+2]=255-da[i+2]; }
                if(type === 'bw') { const a=(da[i]+da[i+1]+da[i+2])/3; da[i]=a; da[i+1]=a; da[i+2]=a; }
            }
            ctx.putImageData(d, 0, 0);
            commitEdit();
        }

        function doUpscale(fac) {
            if(!state.editor.img) return;
            const temp = new Image();
            temp.src = cvs.toDataURL();
            temp.onload = () => {
                cvs.width *= fac; cvs.height *= fac;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(temp, 0, 0, cvs.width, cvs.height);
                commitEdit();
                alert(`Upscaled ${fac}x`);
            };
        }

        function resetCanvas() {
            if(!confirm('Reset?')) return;
            state.editor.history = [];
            state.editor.filters = {b:100, c:100};
            draw(state.editor.img.src);
        }

        function downloadEdit() {
            if(!state.editor.img) return;
            const a = document.createElement('a');
            a.download = 'edited_' + state.editor.name;
            a.href = cvs.toDataURL('image/jpeg', 0.9);
            a.click();
        }

        // Auto Textarea
        document.getElementById('prompt').addEventListener('keydown', e => {
            if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });
    </script>
</body>
</html>
