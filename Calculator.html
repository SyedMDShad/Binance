<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profit Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    /* Body styling for black dark mode with glassy gradient */
    body {
      background: linear-gradient(145deg, #121212, #0a0a0a); /* Very dark, near-black gradient */
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #f0f0f0; /* Lighter text color for better contrast on black */
    }

    /* Container styling with enhanced glassy effect */
    .container {
      background: rgba(255, 255, 255, 0.05); /* Slightly more visible white tint for glass */
      backdrop-filter: blur(30px) saturate(200%); /* Stronger blur and saturation */
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.7); /* Deeper, more pronounced shadow */
      max-width: 420px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.12); /* Slightly more visible border */
      transition: all 0.5s ease-in-out; /* Smooth transition for overall container */
    }

    .container:hover {
        box-shadow: 0 15px 50px 0 rgba(0, 0, 0, 0.8); /* Even deeper shadow on hover */
        border-color: rgba(255, 255, 255, 0.2); /* Lighter border on hover */
    }

    /* Heading styling */
    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); /* More intense glow for heading */
    }

    /* Label styling */
    label {
      font-weight: 500;
      display: block;
      margin-top: 18px;
      color: #b0b0b0;
      margin-bottom: 5px;
    }

    /* Input and select field styling */
    select,
    input[type="number"] {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.07);
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease; /* Smooth transition for focus/hover */
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    /* Enhanced glassy effect on hover/focus for inputs */
    select:focus,
    input[type="number"]:focus,
    select:hover,
    input[type="number"]:hover {
      border-color: rgba(255, 255, 255, 0.4); /* Lighter border on focus/hover */
      box-shadow: 0 0 20px rgba(135, 206, 250, 0.3), /* Blue glow */
                  inset 0 0 10px rgba(255, 255, 255, 0.1); /* Inner subtle shimmer */
      background: rgba(255, 255, 255, 0.15); /* More visible transparency on focus/hover */
    }


    /* Placeholder styling */
    input[type="number"]::placeholder {
      color: #666666;
      opacity: 0.8;
    }

    /* Result display styling */
    .result {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    /* Profit specific styling */
    .profit {
      color: #32CD32; /* Lime green for profit */
      text-shadow: 0 0 12px rgba(50, 205, 50, 0.6); /* More intense green glow */
    }

    /* Loss specific styling */
    .loss {
      color: #FF6347; /* Tomato red for loss */
      text-shadow: 0 0 12px rgba(255, 99, 71, 0.6); /* More intense red glow */
    }

    /* Fee info styling */
    .fee-box {
      font-size: 13px;
      text-align: right;
      margin-top: 10px;
      color: #707070;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Profit Calculator</h2>

    <label for="investment">Investment:</label>
    <select id="investment" class="rounded-lg shadow-inner">
      <!-- Options generated by JS -->
    </select>

    <label for="buy">Buy Price:</label>
    <input type="number" id="buy" placeholder="Enter Buy Price" step="any" class="rounded-lg shadow-inner" />

    <label for="sell">Sell Price:</label>
    <input type="number" id="sell" placeholder="Enter Sell Price" step="any" class="rounded-lg shadow-inner" />

    <div class="result" id="profitResult">+0.00$</div>
    <div class="fee-box" id="feeInfo">Fee: 0.00$</div>
  </div>

  <script>
    const investmentEl = document.getElementById('investment');
    const buyEl = document.getElementById('buy');
    const sellEl = document.getElementById('sell');
    const resultEl = document.getElementById('profitResult');
    const feeEl = document.getElementById('feeInfo');

    // Populate investment options (100 to 3000)
    for (let i = 100; i <= 3000; i += 100) {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = `$${i}`;
      if (i === 1000) option.selected = true; // Default to $1000
      investmentEl.appendChild(option);
    }

    /**
     * Calculates the profit/loss based on investment, buy price, and sell price.
     * Updates the UI with the calculated profit/loss and fee.
     */
    function calculateProfit() {
      const investment = parseFloat(investmentEl.value);
      const buy = parseFloat(buyEl.value);
      const sell = parseFloat(sellEl.value);

      // Handle invalid or missing inputs
      if (isNaN(investment) || isNaN(buy) || isNaN(sell) || buy === 0) {
        resultEl.textContent = '+0.00$';
        resultEl.className = 'result'; // Reset class
        feeEl.textContent = 'Fee: 0.00$';
        return;
      }

      // Calculate quantity of asset bought
      const quantity = investment / buy;
      // Calculate raw sell value before fees
      const rawSell = quantity * sell;

      // Define fee percentage (0.075% for buy + 0.075% for sell with BNB discount)
      const feePercent = 0.00075 * 2;
      // Calculate total transaction fee based on initial investment
      const totalFee = investment * feePercent;

      // Calculate net profit/loss
      const profit = rawSell - investment - totalFee;

      // Update result text and apply appropriate class for styling (profit/loss)
      resultEl.textContent = `${profit >= 0 ? '+' : ''}${profit.toFixed(2)}$`;
      resultEl.className = profit >= 0 ? 'result profit' : 'result loss';

      // Update fee information
      feeEl.textContent = `Fee: ${totalFee.toFixed(2)}$`;
    }

    // Attach event listeners for real-time calculation
    investmentEl.addEventListener('change', calculateProfit);
    buyEl.addEventListener('input', calculateProfit);
    sellEl.addEventListener('input', calculateProfit);

    // Initial calculation when the page loads
    calculateProfit();
  </script>
</body>
</html>
